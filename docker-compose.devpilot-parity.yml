# F454 isolated V13 parity Docker stack.
#
# Fully self-contained demo-parity project: own compose project name, own
# default network (devpilot-parity_default), own named volumes, own published
# ports, own MySQL DB name (devpilot_parity) and own Redis. Nothing here joins
# any other staging network or non-parity volume.
#
# The API container enables the controlled-local build executor and the
# local-filesystem staging deployment provider (see scripts/parity-switches.md
# for the exact env matrix vs the fail-closed base defaults in
# docker-compose.devpilot-app.yml).
#
# Bring up:
#   node scripts/parity-seed.mjs up        # ensure fixture git repo, up, migrate, seed
#   node scripts/parity-seed.mjs reset     # down + prune parity volumes/network (allowlisted) + reseed
x-runtime-labels: &runtime-labels
  org.opencontainers.image.revision: ${PARITY_SOURCE_REVISION:-unverified}
  io.svton.devpilot.source-tree-sha256: ${PARITY_SOURCE_TREE_SHA256:-unverified}
  io.svton.devpilot.runtime-id: ${PARITY_RUNTIME_ID:-default}
  io.svton.devpilot.goal-id: ${PARITY_GOAL_ID:-unverified}
  io.svton.devpilot.cleanup-owner-token: ${PARITY_CLEANUP_OWNER_TOKEN:-unverified}

name: ${PARITY_COMPOSE_PROJECT:-devpilot-parity}

volumes:
  devpilot-parity-mysql:
    name: ${PARITY_COMPOSE_PROJECT:-devpilot-parity}-mysql
    labels: *runtime-labels
  devpilot-parity-redis:
    name: ${PARITY_COMPOSE_PROJECT:-devpilot-parity}-redis
    labels: *runtime-labels
  devpilot-parity-release-build:
    name: ${PARITY_COMPOSE_PROJECT:-devpilot-parity}-release-build
    labels: *runtime-labels
  devpilot-parity-deployments:
    name: ${PARITY_COMPOSE_PROJECT:-devpilot-parity}-deployments
    labels: *runtime-labels
  devpilot-parity-deploy-target-data:
    name: ${PARITY_COMPOSE_PROJECT:-devpilot-parity}-deploy-target-data
    labels: *runtime-labels

networks:
  default:
    name: ${PARITY_COMPOSE_PROJECT:-devpilot-parity}-network
    labels: *runtime-labels

services:
  mysql:
    image: mysql@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    restart: unless-stopped
    labels: *runtime-labels
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ${PARITY_DATABASE_NAME:-devpilot_parity}
    ports:
      - "127.0.0.1:${PARITY_MYSQL_PORT:-4334}:3306"
    volumes:
      - devpilot-parity-mysql:/var/lib/mysql
    healthcheck:
      test:
        ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    labels: *runtime-labels
    ports:
      - "127.0.0.1:${PARITY_REDIS_PORT:-4384}:6379"
    volumes:
      - devpilot-parity-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: apps/devpilot-api/Dockerfile
      target: api
      labels: *runtime-labels
    image: ${PARITY_API_IMAGE:-devpilot-parity-api:local}
    labels: *runtime-labels
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PARITY_API_PORT:-4132}:4132"
    environment:
      NODE_ENV: production
      PORT: "4132"
      # Own parity MySQL/Redis by service name on the parity network
      DATABASE_URL: mysql://root:password@mysql:3306/${PARITY_DATABASE_NAME:-devpilot_parity}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CORS_ORIGIN: http://localhost:${PARITY_WEB_PORT:-4131}
      JWT_SECRET: devpilot-parity-jwt-secret
      # Pin the API encryption key to its default so the seed-side encrypted
      # SecretKey value is decryptable by the running API (same approach as
      # scripts/devpilot-docker-staging.mjs).
      ENCRYPTION_KEY: default-32-char-encryption-key!
      # Bootstrap a system-level admin on startup (see admin-bootstrap.service.ts)
      DEVPILOT_BOOTSTRAP_ADMIN_EMAIL: admin@parity.local
      DEVPILOT_BOOTSTRAP_ADMIN_PASSWORD: ParityDemo123!
      # ----- Controlled-local build executor (AC-E2E-005; see parity-switches.md) -----
      RELEASE_BUILD_EXECUTION_ENABLED: "true"
      RELEASE_BUILD_EXECUTOR_PROFILE: controlled-local-v1
      RELEASE_BUILD_WORK_ROOT: /var/lib/devpilot/release-build/work
      RELEASE_BUILD_ARTIFACT_ROOT: /var/lib/devpilot/release-build/artifacts
      RELEASE_BUILD_RUN_TIMEOUT_MS: "180000"
      RELEASE_BUILD_COMMAND_TIMEOUT_MS: "120000"
      RELEASE_BUILD_CANCEL_GRACE_MS: "5000"
      RELEASE_BUILD_MAX_CONCURRENCY: "2"
      RELEASE_BUILD_COMMAND_PATH: /pnpm:/usr/local/bin:/usr/bin:/bin
      # ----- Local-filesystem staging deployment provider (AC-E2E-005) -----
      RELEASE_STAGING_DEPLOYMENT_ENABLED: "true"
      RELEASE_DEPLOYMENT_PROVIDER_PROFILE: local-filesystem-v1
      RELEASE_STAGING_DEPLOYMENT_ROOT: /var/lib/devpilot/release-build/deployments
      RELEASE_STAGING_DEPLOYMENT_TIMEOUT_MS: "120000"
      # ----- Real route-control provider + independent readback (F465) -----
      SITE_ROUTE_SWITCH_PROVIDER_PROFILE: http-route-control-v1
      SITE_ROUTE_SWITCH_HTTP_ENDPOINT: http://route-control:8080
      SITE_ROUTE_SWITCH_HTTP_TOKEN: ${PARITY_ROUTE_CONTROL_TOKEN:-devpilot-parity-route-control-token-0001}
      SITE_ROUTE_SWITCH_HTTP_TIMEOUT_MS: "5000"
      # Allow the committed parity fixture repository (mounted read-only below)
      # to be connected/analyzed/build through the real git executor.
      REPOSITORY_ANALYSIS_LOCAL_ROOTS: /read-only-repositories
    volumes:
      - devpilot-parity-release-build:/var/lib/devpilot/release-build
      - devpilot-parity-deployments:/var/lib/devpilot/release-build/deployments
      # The committed parity fixture monorepo (a real git repo). Materialized by
      # scripts/parity-seed.mjs at PARITY_FIXTURE_GIT_ROOT (default below) from
      # the committed files under fixtures/parity-app/.
      - ${PARITY_FIXTURE_GIT_ROOT:-/tmp/codex-tool-runs/svton/f454/parity-app-git}:/read-only-repositories/parity-app:ro
      - ${PARITY_FIXTURE_GIT_ROOT:-/tmp/codex-tool-runs/svton/f454/parity-app-git}:/read-only-repositories/parity-app-intake:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      route-control:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4132/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/devpilot-web/Dockerfile
      target: web
      labels: *runtime-labels
    image: ${PARITY_WEB_IMAGE:-devpilot-parity-web:local}
    labels: *runtime-labels
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PARITY_WEB_PORT:-4131}:3120"
    environment:
      # Browser hits the parity API via the host-published port
      NEXT_PUBLIC_API_URL: http://localhost:${PARITY_API_PORT:-4132}
      # SSR inside the container network hits the parity API container directly
      INTERNAL_API_URL: http://api:4132
      NEXTAUTH_URL: http://localhost:${PARITY_WEB_PORT:-4131}
      NEXTAUTH_SECRET: devpilot-parity-web-secret
    depends_on:
      - api

  route-control:
    build:
      context: .
      dockerfile: scripts/parity-route-control.Dockerfile
      labels: *runtime-labels
    image: ${PARITY_ROUTE_CONTROL_IMAGE:-devpilot-parity-route-control:local}
    restart: unless-stopped
    labels: *runtime-labels
    ports:
      - "127.0.0.1:${PARITY_ROUTE_CONTROL_PORT:-43993}:8080"
    environment:
      PORT: "8080"
      ROUTE_CONTROL_TOKEN: ${PARITY_ROUTE_CONTROL_TOKEN:-devpilot-parity-route-control-token-0001}
    command: ["node", "/app/parity-route-control-provider.mjs"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  deploy-target:
    build:
      context: .
      dockerfile: scripts/parity-deploy-target.Dockerfile
      labels: *runtime-labels
    image: ${PARITY_DEPLOY_TARGET_IMAGE:-devpilot-parity-deploy-target:local}
    restart: unless-stopped
    labels: *runtime-labels
    ports:
      - "127.0.0.1:${PARITY_SSH_PORT:-4222}:2222"
    environment:
      # NOTE: linuxserver/openssh-server gates password auth on PASSWORD_ACCESS.
      PASSWORD_ACCESS: "true"
      USER_NAME: deploy
      USER_PASSWORD: devpilot-test
      SUDO_ACCESS: "false"
      PUID: "1000"
      PGID: "1000"
    volumes:
      - devpilot-parity-deploy-target-data:/config
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 2222 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  # Tiny static site: host probes use the unique published port while the
  # route-control provider proxies through target-workload:80 on this
  # run-owned Compose network.
  target-workload:
    build:
      context: .
      dockerfile: scripts/parity-target-workload.Dockerfile
      labels: *runtime-labels
    image: ${PARITY_TARGET_WORKLOAD_IMAGE:-devpilot-parity-target-workload:local}
    restart: unless-stopped
    labels: *runtime-labels
    ports:
      - "127.0.0.1:${PARITY_TARGET_PORT:-43992}:80"
    networks:
      default:
        aliases:
          - parity-target-workload
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
