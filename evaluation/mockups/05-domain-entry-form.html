<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设计稿 05 · 域名入口表单修复（D1/D2）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px; color: #0f172a; background: #f8fafc; }
  .note { background: #eff6ff; border-left: 4px solid #2563eb; padding: 12px 16px; font-size: 13px; color: #1e3a8a; line-height: 1.6; }
  .note strong { color: #1d4ed8; }
  .shell { display: flex; min-height: calc(100vh - 46px); }
  .sidebar { width: 220px; background: #e2e8f0; padding: 16px 0; flex-shrink: 0; }
  .sidebar .logo { font-weight: 700; font-size: 16px; padding: 0 20px 16px; border-bottom: 1px solid #cbd5e1; margin-bottom: 12px; }
  .sidebar .menu { padding: 6px 20px; color: #475569; font-size: 13px; }
  .sidebar .menu.active { background: #cbd5e1; color: #0f172a; font-weight: 600; }
  .content { flex: 1; padding: 24px; position: relative; }
  .page-title { font-size: 20px; font-weight: 700; margin-bottom: 16px; }
  .stage-label { display: inline-block; font-size: 12px; color: #d97706; background: #fffbeb; border-radius: 4px; padding: 2px 8px; margin-bottom: 8px; }
  .stage-label.ok { color: #16a34a; background: #f0fdf4; }
  .mask { background: rgba(15, 23, 42, .35); border-radius: 8px; padding: 32px 0; display: flex; justify-content: center; margin-bottom: 24px; }
  .modal { width: 640px; max-width: 100%; background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; box-shadow: 0 12px 32px rgba(15,23,42,.18); overflow: hidden; }
  .modal .m-head { padding: 16px 24px; border-bottom: 1px solid #e2e8f0; font-size: 16px; font-weight: 600; }
  .modal .m-body { padding: 20px 24px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .req { color: #dc2626; margin-left: 2px; }
  .opt { color: #94a3b8; font-weight: 400; font-size: 12px; margin-left: 4px; }
  .input-wrap { position: relative; }
  .input-wrap input, .input-wrap select { width: 100%; padding: 8px 32px 8px 10px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 13px; background: #fff; }
  .input-wrap input.err { border-color: #dc2626; }
  .input-wrap input.ok { border-color: #16a34a; }
  .check { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: #16a34a; font-weight: 700; }
  .f-err { font-size: 12px; color: #dc2626; margin-top: 4px; }
  .f-warn { font-size: 12px; color: #d97706; background: #fffbeb; border-radius: 4px; padding: 6px 10px; margin-top: 6px; }
  .chip { display: inline-block; padding: 4px 10px; border-radius: 999px; background: #f1f5f9; color: #475569; font-size: 12px; }
  .m-foot { padding: 14px 24px; border-top: 1px solid #e2e8f0; display: flex; align-items: center; gap: 10px; }
  .m-foot .hint { margin-left: auto; font-size: 12px; color: #94a3b8; }
  .btn { padding: 8px 16px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .btn-ghost { background: #fff; color: #475569; border: 1px solid #e2e8f0; }
  .btn-primary { background: #2563eb; color: #fff; border: none; }
  .btn-disabled { background: #f1f5f9; color: #94a3b8; border: 1px solid #e2e8f0; cursor: not-allowed; }
</style>
</head>
<body>
<div class="note">
  <strong>D1/D2 · 域名入口表单修复：</strong>必填字段加 * 标记；非法/未完成时给出可见的校验信息（错误态、琥珀色提示、禁用按钮的原因说明），「添加入口」按钮在表单未完成时禁用并说明原因。
</div>
<div class="shell">
  <aside class="sidebar">
    <div class="logo">Devpilot</div>
    <div class="menu active">项目</div>
    <div class="menu">发布</div>
    <div class="menu">资源</div>
    <div class="menu">监控告警</div>
  </aside>
  <main class="content">
    <h1 class="page-title">域名与入口 · Picshare</h1>

    <span class="stage-label">状态一：校验未通过</span>
    <div class="mask">
      <div class="modal">
        <div class="m-head">添加域名入口</div>
        <div class="m-body">
          <div class="field">
            <label>站点名称<span class="req">*</span></label>
            <div class="input-wrap"><input class="err" type="text" value="" placeholder="例如：Picshare 用户端"></div>
            <div class="f-err">请输入站点名称</div>
          </div>
          <div class="field">
            <label>主域名<span class="req">*</span></label>
            <div class="input-wrap"><input class="ok" type="text" value="app.example.com"><span class="check">✓</span></div>
          </div>
          <div class="field">
            <label>域名别名<span class="opt">（可选）</span></label>
            <div class="input-wrap"><input type="text" placeholder="例如：www.example.com"></div>
          </div>
          <div class="field">
            <label>运行时类型</label>
            <div class="input-wrap"><select><option>反向代理</option><option>静态站点</option></select></div>
          </div>
          <div class="field">
            <label>目标服务器<span class="req">*</span></label>
            <div class="input-wrap"><select><option>无服务器</option><option>F383 Picshare Deploy（离线）</option></select></div>
            <div class="f-warn">尚未选择目标服务器，入口将无法转发流量</div>
          </div>
          <div class="field">
            <label>关联项目与项目环境</label>
            <span class="chip">Picshare · 开发</span>
          </div>
        </div>
        <div class="m-foot">
          <button class="btn btn-ghost">取消</button>
          <button class="btn btn-disabled" disabled>添加入口</button>
          <span class="hint">完成必填项后可添加</span>
        </div>
      </div>
    </div>

    <span class="stage-label ok">状态二：校验通过</span>
    <div class="mask">
      <div class="modal">
        <div class="m-head">添加域名入口</div>
        <div class="m-body">
          <div class="field">
            <label>站点名称<span class="req">*</span></label>
            <div class="input-wrap"><input class="ok" type="text" value="Picshare 用户端"><span class="check">✓</span></div>
          </div>
          <div class="field">
            <label>主域名<span class="req">*</span></label>
            <div class="input-wrap"><input class="ok" type="text" value="app.example.com"><span class="check">✓</span></div>
          </div>
          <div class="field">
            <label>域名别名<span class="opt">（可选）</span></label>
            <div class="input-wrap"><input type="text" placeholder="例如：www.example.com"></div>
          </div>
          <div class="field">
            <label>运行时类型</label>
            <div class="input-wrap"><select><option>反向代理</option><option>静态站点</option></select></div>
          </div>
          <div class="field">
            <label>目标服务器<span class="req">*</span></label>
            <div class="input-wrap"><select><option>F383 Picshare Deploy（离线）</option><option>无服务器</option></select></div>
          </div>
          <div class="field">
            <label>关联项目与项目环境</label>
            <span class="chip">Picshare · 开发</span>
          </div>
        </div>
        <div class="m-foot">
          <button class="btn btn-ghost">取消</button>
          <button class="btn btn-primary">添加入口</button>
        </div>
      </div>
    </div>
  </main>
</div>
</body>
</html>
