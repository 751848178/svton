schemaVersion: 2
name: shipkit
services:
  server:
    dockerfile: shipkit/ops/container/Dockerfile
    context: .
    target: runtime
    platform: linux/amd64
    ports: ["127.0.0.1:28769:8769"]
    healthcheck: { path: /api/health, hostPort: 28769, timeoutSeconds: 120 }
    volumes:
      - /srv/shipkit/data:/var/lib/shipkit
      - /srv/shipkit/config:/etc/shipkit:ro
    runtime:
      readOnlyRoot: true
      dropCapabilities: [ALL]
      noNewPrivileges: true
      stopGracePeriodSeconds: 45
      tmpfs:
        - { target: /tmp, sizeMiB: 128, uid: 10001, gid: 10001, mode: '1777' }
        - { target: /app/apps/shipkit-web/.next/cache, sizeMiB: 64, uid: 10001, gid: 10001, mode: '0700' }
