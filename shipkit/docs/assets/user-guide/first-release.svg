<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="635" viewBox="0 0 1080 635" role="img" aria-labelledby="title desc"><title id="title">首次部署的六个步骤</title><desc id="desc">准备命令、安装机器、填写配置、检查连接、构建部署、验证业务。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#526982" stroke-width="1.5"/></marker></defs><style>text{font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif;fill:#142c46}.title{font-size:28px;font-weight:700}.sub{font-size:17px;fill:#536a80}.label{font-size:20px;font-weight:650}.body{font-size:18px}.tiny{font-size:16px;fill:#536a80}.num{font-size:17px;font-weight:700;fill:#fff}</style><rect width="1080" height="635" rx="20" fill="#f4f7fa"/><text x="34" y="48" class="title">第一次发布：走通六步，再合并成一条命令</text><text x="34" y="81" class="sub">主流程使用固定构建机；每一步都检查完成标志。</text><rect x="34" y="126" width="298" height="153" rx="14" fill="#fff" stroke="#cfdae5"/><rect x="54" y="145" width="30" height="30" rx="9" fill="#17656c"/><text x="63" y="166" class="num">1</text><text x="98" y="167" class="label">准备 CLI</text><text x="56" y="204" class="body">编译 shipkit</text><text x="56" y="233" class="body">ship help 能显示命令</text><rect x="391" y="126" width="298" height="153" rx="14" fill="#fff" stroke="#cfdae5"/><rect x="411" y="145" width="30" height="30" rx="9" fill="#17656c"/><text x="420" y="166" class="num">2</text><text x="455" y="167" class="label">接入机器</text><text x="413" y="204" class="body">安装 agent + 仓库凭证</text><text x="413" y="233" class="body">HTTPS 入口可访问</text><rect x="748" y="126" width="298" height="153" rx="14" fill="#fff" stroke="#cfdae5"/><rect x="768" y="145" width="30" height="30" rx="9" fill="#17656c"/><text x="777" y="166" class="num">3</text><text x="812" y="167" class="label">填写配置</text><text x="770" y="204" class="body">ship.config.yaml</text><text x="770" y="233" class="body">ship.yaml + deploy.env</text><rect x="34" y="358" width="298" height="153" rx="14" fill="#fff" stroke="#cfdae5"/><rect x="54" y="377" width="30" height="30" rx="9" fill="#17656c"/><text x="63" y="398" class="num">4</text><text x="98" y="399" class="label">检查连接</text><text x="56" y="436" class="body">ship doctor</text><text x="56" y="465" class="body">鉴权、角色、Docker 可用</text><rect x="391" y="358" width="298" height="153" rx="14" fill="#fff" stroke="#cfdae5"/><rect x="411" y="377" width="30" height="30" rx="9" fill="#17656c"/><text x="420" y="398" class="num">5</text><text x="455" y="399" class="label">构建与部署</text><text x="413" y="436" class="body">ship build --from-dir .</text><text x="413" y="465" class="body">ship deploy --to staging</text><rect x="748" y="358" width="298" height="153" rx="14" fill="#fff" stroke="#cfdae5"/><rect x="768" y="377" width="30" height="30" rx="9" fill="#17656c"/><text x="777" y="398" class="num">6</text><text x="812" y="399" class="label">验证应用</text><text x="770" y="436" class="body">ship status --to staging</text><text x="770" y="465" class="body">打开业务页 + /health</text><path d="M332 202 L383 202" fill="none" stroke="#526982" stroke-width="2" marker-end="url(#arrow)"/><path d="M689 202 L740 202" fill="none" stroke="#526982" stroke-width="2" marker-end="url(#arrow)"/><path d="M897 279 V319 H183 V350" fill="none" stroke="#526982" stroke-width="2" marker-end="url(#arrow)"/><path d="M332 434 L383 434" fill="none" stroke="#526982" stroke-width="2" marker-end="url(#arrow)"/><path d="M689 434 L740 434" fill="none" stroke="#526982" stroke-width="2" marker-end="url(#arrow)"/><rect x="34" y="550" width="1012" height="55" rx="12" fill="#dfeeed"/><text x="57" y="584" class="label">日常发布：ship release --from-dir . --to staging</text></svg>