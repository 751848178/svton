<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="683" viewBox="0 0 1080 683" role="img" aria-labelledby="title desc"><title id="title">发布结果与恢复路径</title><desc id="desc">部署成功验证业务；退出码5检查自动恢复；4或6查失败日志。主动回滚不恢复数据库。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#526982" stroke-width="1.5"/></marker></defs><style>text{font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif;fill:#142c46}.title{font-size:28px;font-weight:700}.sub{font-size:17px;fill:#536a80}.label{font-size:20px;font-weight:650}.body{font-size:18px}.tiny{font-size:16px;fill:#536a80}.num{font-size:17px;font-weight:700;fill:#fff}</style><rect width="1080" height="683" rx="20" fill="#f4f7fa"/><text x="34" y="48" class="title">发布之后：按结果决定下一步</text><text x="34" y="81" class="sub">自动恢复成功也代表本次新版本发布失败；不要只看服务还能不能打开。</text><rect x="373" y="114" width="334" height="102" rx="14" fill="#fff" stroke="#cfdae5"/><text x="395" y="155" class="label">执行 deploy / release</text><text x="395" y="192" class="body">读取退出码与任务结果</text><path d="M540 216 V256 H195 V300 M540 256 V300 M540 256 H885 V300" fill="none" stroke="#526982" stroke-width="2"/><rect x="44" y="300" width="302" height="171" rx="14" fill="#e6f2ee" stroke="#cfdae5"/><text x="66" y="341" class="label">退出码 0</text><text x="66" y="378" class="body">部署成功</text><text x="66" y="407" class="body">检查 status 与业务页面</text><text x="66" y="436" class="body">确认运行的是预期版本</text><rect x="389" y="300" width="302" height="171" rx="14" fill="#fff2dc" stroke="#cfdae5"/><text x="411" y="341" class="label">退出码 5</text><text x="411" y="378" class="body">新版本失败，旧版已恢复</text><text x="411" y="407" class="body">查失败日志，修复新版本</text><text x="411" y="436" class="body">验证当前服务仍然正常</text><rect x="734" y="300" width="302" height="171" rx="14" fill="#fceae8" stroke="#cfdae5"/><text x="756" y="341" class="label">退出码 4 / 6</text><text x="756" y="378" class="body">任务失败 / 恢复也失败</text><text x="756" y="407" class="body">查 job 与运行机服务日志</text><text x="756" y="436" class="body">判断是否需要人工恢复</text><text x="48" y="528" class="label">需要主动回到上一版？</text><text x="48" y="565" class="body">ship rollback demo-web --to staging</text><text x="48" y="606" class="sub">回滚范围：镜像 + 环境变量 + 发布配置；数据库与外部数据需另行恢复。</text><text x="48" y="651" class="sub">超时或断连：先查原 job，服务器任务可能仍在执行。</text></svg>