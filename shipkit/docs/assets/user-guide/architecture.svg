<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="622" viewBox="0 0 1080 622" role="img" aria-labelledby="title desc"><title id="title">Shipkit 系统分工</title><desc id="desc">控制器向构建机和运行机提交任务；构建机推送镜像，运行机从仓库拉取镜像。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#526982" stroke-width="1.5"/></marker></defs><style>text{font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif;fill:#142c46}.title{font-size:28px;font-weight:700}.sub{font-size:17px;fill:#536a80}.label{font-size:20px;font-weight:650}.body{font-size:18px}.tiny{font-size:16px;fill:#536a80}.num{font-size:17px;font-weight:700;fill:#fff}</style><rect width="1080" height="622" rx="20" fill="#f4f7fa"/><text x="34" y="48" class="title">从源码到服务：四个组件，各司其职</text><text x="34" y="81" class="sub">实线表示主要任务与镜像流向；控制器负责提交任务并读取结果。</text><rect x="34" y="132" width="268" height="178" rx="14" fill="#fff" stroke="#cfdae5"/><rect x="54" y="151" width="30" height="30" rx="9" fill="#17656c"/><text x="63" y="172" class="num">1</text><text x="98" y="173" class="label">控制器 / ship CLI</text><text x="56" y="210" class="body">读取两个 YAML 配置</text><text x="56" y="239" class="body">提交任务 · 等待结果</text><text x="56" y="268" class="body">保存最近一次构建记录</text><rect x="389" y="132" width="290" height="178" rx="14" fill="#fff" stroke="#cfdae5"/><rect x="409" y="151" width="30" height="30" rx="9" fill="#17656c"/><text x="418" y="172" class="num">2</text><text x="453" y="173" class="label">构建机 / builder</text><text x="411" y="210" class="body">获取 Git 或上传的源码</text><text x="411" y="239" class="body">Docker build → push</text><text x="411" y="268" class="body">固定机器或临时云实例</text><rect x="764" y="132" width="282" height="178" rx="14" fill="#fff" stroke="#cfdae5"/><rect x="784" y="151" width="30" height="30" rx="9" fill="#17656c"/><text x="793" y="172" class="num">3</text><text x="828" y="173" class="label">镜像仓库 / Registry</text><text x="786" y="210" class="body">保存镜像与 digest</text><text x="786" y="239" class="body">builder 推送</text><text x="786" y="268" class="body">runtime 拉取</text><path d="M302 220 L382 220" fill="none" stroke="#526982" stroke-width="2" marker-end="url(#arrow)"/><text x="312" y="201" class="tiny">构建</text><path d="M679 220 L757 220" fill="none" stroke="#526982" stroke-width="2" marker-end="url(#arrow)"/><text x="692" y="201" class="tiny">push</text><rect x="389" y="370" width="290" height="168" rx="14" fill="#fff" stroke="#cfdae5"/><rect x="409" y="389" width="30" height="30" rx="9" fill="#17656c"/><text x="418" y="410" class="num">4</text><text x="453" y="411" class="label">运行机 / runtime</text><text x="411" y="448" class="body">拉取镜像 → Compose 启动</text><text x="411" y="477" class="body">健康检查 · 快照回滚</text><text x="411" y="506" class="body">发布账本 · 镜像清理</text><path d="M168 310 V453 H381" fill="none" stroke="#526982" stroke-width="2" marker-end="url(#arrow)"/><text x="180" y="433" class="tiny">部署 / 回滚 / 查询</text><path d="M905 310 V453 H687" fill="none" stroke="#526982" stroke-width="2" marker-end="url(#arrow)"/><text x="801" y="433" class="tiny">pull</text><text x="34" y="589" class="sub">管理流量：公网使用 HTTPS 或受控加密通道。业务入口与 agent 管理入口分别配置。</text></svg>