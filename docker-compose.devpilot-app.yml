name: devpilot-app

volumes:
  devpilot-app-release-build: {}

networks:
  staging:
    external: true
    name: devpilot-g003-staging_default

services:
  api:
    build:
      context: .
      dockerfile: apps/devpilot-api/Dockerfile
      # api-acceptance 携带 controlled-local-acceptance-v2 所需的本地验收工具链
      # （semgrep/trivy/gitleaks + supply proofs）；发布流程（构建→预发→生产）
      # 在本栈需要可执行，矩阵与 docker-compose.devpilot-parity.yml 保持一致。
      target: api-acceptance
    image: devpilot-app-api:local
    container_name: devpilot-app-api
    restart: unless-stopped
    networks:
      - staging
    ports:
      - "3121:3121"
    environment:
      NODE_ENV: production
      PORT: "3121"
      # Reach the staging MySQL/Redis containers by name on the shared network
      DATABASE_URL: mysql://root:password@devpilot-g003-api-mysql:3306/devpilot_g003_staging
      REDIS_HOST: devpilot-g003-api-redis
      REDIS_PORT: "6379"
      CORS_ORIGIN: http://localhost:3120
      # Bootstrap a system-level admin (role=admin) on startup. See
      # apps/devpilot-api/src/admin/admin-bootstrap.service.ts. Both vars must
      # be set; absent = silent no-op.
      DEVPILOT_BOOTSTRAP_ADMIN_EMAIL: admin@devpilot.local
      DEVPILOT_BOOTSTRAP_ADMIN_PASSWORD: "DemoPass123!"
      # ----- Real data-plane feature flags (master, post-pool-merge) -----
      # Enable the ssh-live adapter so non-dryRun ServerExecutor / deploy
      # commands actually SSH into targets. See
      # apps/devpilot-api/src/server-executor/adapters/ssh-live.adapter.ts.
      SERVER_EXECUTOR_LIVE_ENABLED: "true"
      # Keep the queue worker consuming the live-execution queue.
      SERVER_EXECUTOR_QUEUE_WORKER_ENABLED: "true"
      # Enable the real HTTP-based resource-pool provisioning path (the one
      # that actually creates MySQL/Redis DBs + users). See
      # apps/devpilot-api/src/resource-request/resource-request-provisioning.service.ts.
      RESOURCE_REQUEST_PROVISIONING_HTTP_ENABLED: "true"
      # Enable project-level release orchestration (F383) for local verification.
      DEVPILOT_RELEASE_ORCHESTRATION_ENABLED: "true"
      # ----- Local-filesystem staging deployment (same switch as the parity
      # stack). Without it the 预发→生产 chain cannot execute at all. -----
      # NOTE on build execution: current source requires the external
      # OCI-launcher worker infra (v13 acceptance overlay) for real builds;
      # enabling RELEASE_BUILD_EXECUTION_ENABLED here crash-loops the API at
      # bootstrap (UNTRUSTED_WORKER_PROVIDER_MISSING). New release orders stop
      # at the build step by design (fail-closed); existing orders with a
      # successful manifest can complete staging → production.
      RELEASE_BUILD_EXECUTION_ENABLED: "false"
      RELEASE_BUILD_EXECUTOR_PROFILE: disabled
      RELEASE_STAGING_DEPLOYMENT_ENABLED: "true"
      RELEASE_DEPLOYMENT_PROVIDER_PROFILE: local-filesystem-v1
      RELEASE_STAGING_DEPLOYMENT_ROOT: /var/lib/devpilot/release-build/deployments
      RELEASE_STAGING_DEPLOYMENT_TIMEOUT_MS: "120000"
      # Local repository analysis remains default-off in production. This
      # disposable app stack exposes only the explicitly mounted read-only root.
      REPOSITORY_ANALYSIS_LOCAL_ROOTS: /read-only-repositories
    volumes:
      # Other secrets (JWT, OAuth...) come from the local .env; env above wins
      - ./apps/devpilot-api/.env:/app/apps/devpilot-api/.env:ro
      # Override the fixture path when validating another repository. The
      # container cannot write to the source checkout.
      - ${DEVPILOT_REPOSITORY_FIXTURE:-../picshare}:/read-only-repositories/picshare:ro
      - devpilot-app-release-build:/var/lib/devpilot/release-build
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3121/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/devpilot-web/Dockerfile
      target: local-web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3121
    image: devpilot-app-web:local
    container_name: devpilot-app-web
    restart: unless-stopped
    networks:
      - staging
    ports:
      - "3120:3120"
    environment:
      # Browser hits the API via the host-published port
      NEXT_PUBLIC_API_URL: http://localhost:3121
      # SSR inside the container network hits the API container directly
      INTERNAL_API_URL: http://devpilot-app-api:3121
      NEXTAUTH_URL: http://localhost:3120
      NEXTAUTH_SECRET: devpilot-local-docker-secret
    volumes:
      - ./apps/devpilot-web/.env.local:/app/apps/devpilot-web/.env.local:ro
    depends_on:
      - api
